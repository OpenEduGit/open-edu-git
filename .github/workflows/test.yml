name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Required at module load of src/lib/server/auth.ts (see ADR-0004)
      AUTH_SECRET: "ci-test-secret-32-bytes-minimum-length"
    steps:
      - uses: actions/checkout@v4

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.23" # pin: 1.4.4 hangs at install from runners (P4); revisit upstream

      - name: Install dependencies (root, with hang-guard + mirror fallback)
        run: |
          echo "attempt 1: default registry"
          if timeout 420 bun install --frozen-lockfile --network-concurrency 16; then exit 0; fi
          echo "attempt 2: npmmirror fallback (registry degraded; frozen-lockfile verifies hashes)"
          if timeout 420 bun install --frozen-lockfile --network-concurrency 16 --registry https://registry.npmmirror.com; then exit 0; fi
          echo "attempt 3: default registry again"
          timeout 420 bun install --frozen-lockfile --network-concurrency 16

      - name: Install dependencies (classroom-service)
        working-directory: mini-services/classroom-service
        run: |
          echo "attempt 1: default registry"
          if timeout 180 bun install --frozen-lockfile --network-concurrency 16; then exit 0; fi
          echo "attempt 2: npmmirror fallback"
          if timeout 180 bun install --frozen-lockfile --network-concurrency 16 --registry https://registry.npmmirror.com; then exit 0; fi
          echo "attempt 3: default registry again"
          timeout 180 bun install --frozen-lockfile --network-concurrency 16

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run tests (unit + auth integration)
        run: bun run test
