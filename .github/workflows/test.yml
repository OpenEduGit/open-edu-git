name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Required at module load of src/lib/server/auth.ts (see ADR-0004)
      AUTH_SECRET: "ci-test-secret-32-bytes-minimum-length"
    steps:
      - uses: actions/checkout@v4

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (root, with hang-guard retries)
        run: |
          for i in 1 2 3; do
            echo "attempt $i"
            if timeout 420 bun install --frozen-lockfile --network-concurrency 16; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 10
          done

      - name: Install dependencies (classroom-service)
        working-directory: mini-services/classroom-service
        run: |
          for i in 1 2 3; do
            echo "attempt $i"
            if timeout 180 bun install --frozen-lockfile --network-concurrency 16; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 10
          done

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Run tests (unit + auth integration)
        run: bun run test
