name: Secret Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect leaked AUTH_SECRET value
        run: |
          set -e
          # Scan ONLY code/config blobs (excluding docs/** and docs/archive/**)
          # The literal "openedu-git-dev-secret-change-in-production" is a documented
          # post-mortem quote in ADR-0004 and archived worklog — see /tmp/oeg-diag
          if git grep -n -E "AUTH_SECRET=[a-f0-9]{32,}" -- '*.ts' '*.tsx' '*.yml' '*.yaml' '*.env*' '!*.example' 2>/dev/null; then
            echo "::error::AUTH_SECRET value appears in code — do not commit real secrets"
            exit 1
          fi
          # Reject any .env file being committed (all .env* must be gitignored except .env.example)
          if git ls-files | grep -E '^\.env($|\.)' | grep -v '.env.example'; then
            echo "::error::A .env file is tracked — untrack it"
            exit 1
          fi
          echo "✅ no secrets in code blobs"
