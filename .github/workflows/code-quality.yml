name: Code Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # 10min proved too tight for a cold-runner bun install (P4 PR #3 timed out
    # mid-install); 20min matches the test job and the cache makes it moot.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (with hang-guard retries)
        run: |
          for i in 1 2 3; do
            echo "attempt $i"
            if timeout 420 bun install --frozen-lockfile --network-concurrency 16; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 10
          done

      - name: Install classroom-service dependencies
        working-directory: mini-services/classroom-service
        run: |
          for i in 1 2 3; do
            echo "attempt $i"
            if timeout 180 bun install --frozen-lockfile --network-concurrency 16; then break; fi
            [ "$i" = 3 ] && exit 1
            sleep 10
          done

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Type check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint
